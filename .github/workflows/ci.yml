name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Rust and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test

      - name: Run Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile Python tools
        run: |
          PYTHONPYCACHEPREFIX=/tmp/yena_pycache python3 -m py_compile \
            tools/import_markdown_memory.py \
            tools/forget_import_source.py \
            tools/retrieve_memory.py \
            tools/list_audit_events.py \
            tools/dev_memory_smoke.py \
            tools/test_import_markdown_memory.py \
            tools/test_forget_import_source.py \
            tools/test_retrieve_memory.py \
            tools/test_list_audit_events.py \
            tools/test_dev_memory_smoke.py

      - name: Run Python tool tests
        run: |
          PYTHONPYCACHEPREFIX=/tmp/yena_pycache python3 -m unittest \
            tools/test_import_markdown_memory.py \
            tools/test_forget_import_source.py \
            tools/test_retrieve_memory.py \
            tools/test_list_audit_events.py \
            tools/test_dev_memory_smoke.py
